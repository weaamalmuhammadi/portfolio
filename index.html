<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weaam — Game Developer &amp; Programmer</title>
  <meta name="description" content="Walk through Weaam's gallery of games, engines and tools." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />

  <!-- Three.js importmap (used by js/gallery/) -->
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js" } }
  </script>

  <!-- GSAP — must load before intro.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.4/gsap.min.js" defer></script>
</head>
<body>

  <!-- Custom cursor (visible only during intro) -->
  <div class="cursor"          id="cursor"></div>
  <div class="cursor-follower" id="cursorFollower"></div>

  <!-- 3D Gallery Canvas (always present, rendered behind intro) -->
  <canvas id="gameCanvas"></canvas>

  <!-- Film grain + vignette over the gallery (under the intro & UI) -->
  <div class="paper-grain"></div>
  <div class="paper-vignette"></div>

  <!-- ======================================================
       CINEMATIC INTRO
       ====================================================== -->
  <div class="ci" id="ci">
    <!-- Drifting particle field -->
    <canvas class="ci-particles" id="ciParticles"></canvas>

    <!-- Subtle corner decorations -->
    <div class="ci-corner ci-corner--tl"></div>
    <div class="ci-corner ci-corner--tr"></div>
    <div class="ci-corner ci-corner--bl"></div>
    <div class="ci-corner ci-corner--br"></div>

    <!-- Main text + controls -->
    <div class="ci-content">

      <div class="ci-eyebrow">
        <span class="ci-eyebrow-line"></span>
        <span class="ci-eyebrow-text">Portfolio&ensp;·&ensp;2026</span>
        <span class="ci-eyebrow-line"></span>
      </div>

      <h1 class="ci-name">
        <span class="ci-name-letter">W</span><span class="ci-name-tail">eaam</span>
      </h1>

      <div class="ci-divider"></div>

      <p class="ci-role">Game Developer &amp; Programmer</p>

      <div class="ci-controls" id="ciControls">
        <div class="ci-ctrl-row">
          <div class="ci-ctrl-keys">
            <span class="ci-key">W</span><span class="ci-key">A</span><span class="ci-key">S</span><span class="ci-key">D</span>
            <span class="ci-or">or</span>
            <span class="ci-key">↑</span><span class="ci-key">←</span><span class="ci-key">↓</span><span class="ci-key">→</span>
          </div>
          <span class="ci-ctrl-label">Walk the gallery</span>
        </div>
        <div class="ci-ctrl-row">
          <div class="ci-ctrl-keys"><span class="ci-key ci-key-circle">◎</span></div>
          <span class="ci-ctrl-label">Stand in a circle to view</span>
        </div>
        <div class="ci-ctrl-row">
          <div class="ci-ctrl-keys"><span class="ci-key">Esc</span></div>
          <span class="ci-ctrl-label">Open the menu</span>
        </div>
      </div>

      <button class="ci-btn" id="startBtn">
        <span class="ci-btn-bg"></span>
        <span class="ci-btn-label">Enter Gallery</span>
        <svg class="ci-btn-arrow" width="18" height="18" viewBox="0 0 18 18" fill="none">
          <path d="M1 9h16M11 3l6 6-6 6" stroke="currentColor" stroke-width="1.5"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

    </div><!-- /ci-content -->

    <!-- Wipe curtain (covers the intro, then fades to reveal the gallery) -->
    <div class="ci-curtain" id="ciCurtain"></div>
  </div>
  <!-- /ci -->

  <!-- ======================================================
       IN-GALLERY UI  (filled & driven by js/gallery/ui.js)
       ====================================================== -->

  <!-- Soft light wash behind the info panel, for legibility -->
  <div class="scrim" aria-hidden="true"></div>

  <!-- Floating title above the nearest viewing circle -->
  <div class="tag" id="tag" aria-hidden="true">
    <span class="tag-title"></span>
    <span class="tag-hint"></span>
  </div>

  <!-- Project / contact details while the camera frames something -->
  <aside class="panel" id="panel" aria-live="polite"></aside>

  <!-- Full-screen menu -->
  <nav class="menu" id="menu" aria-hidden="true" aria-label="Gallery menu"></nav>

  <!-- Name + menu button (switch between ink and white depending on what's behind them) -->
  <header class="hud-top">
    <div class="brand">
      <span class="brand-name">Weaam</span>
      <span class="brand-role">Game Developer &amp; Programmer</span>
    </div>
    <button class="menu-btn" id="menuBtn" type="button" aria-expanded="false" aria-controls="menu">
      <span class="menu-btn-label">Menu</span>
      <span class="menu-btn-icon" aria-hidden="true"><i></i><i></i></span>
    </button>
  </header>

  <div class="hud" id="hud">
    <!-- Controls legend -->
    <div class="controls" aria-hidden="true">
      <div class="ctrl ctrl-keys">
        <span class="ctrl-label">Move</span>
        <span class="arrows">
          <kbd data-key="up">↑</kbd>
          <kbd data-key="left">←</kbd><kbd data-key="down">↓</kbd><kbd data-key="right">→</kbd>
        </span>
      </div>
      <div class="ctrl ctrl-keys">
        <span class="ctrl-label">Open / Close Menu</span>
        <kbd data-key="esc">Esc</kbd>
      </div>
      <div class="ctrl ctrl-keys">
        <span class="ctrl-label">Walk there</span>
        <span class="mouse" aria-hidden="true"><i></i></span>
      </div>
      <div class="ctrl ctrl-touch">
        <span class="ctrl-label">Tap the floor to walk · stand in a circle to look closer</span>
      </div>
    </div>
  </div>

  <!-- Intro logic (particles, cursor, GSAP timeline, transition) -->
  <script src="js/intro.js" defer></script>

  <!-- 3D gallery (ES modules) -->
  <script type="module" src="js/gallery/main.js"></script>

</body>
</html>
